<!doctype html>
<html lang="zh-CN" class="mln-on">
<head>
<meta charset="utf-8">
<title>在网页上与曳尔沐聊天 · 静态预览</title>
<link rel="stylesheet" href="../dist/webui.css">
<style>
  /* 预览里字体走本地文件，真实宿主里由 JS 注入 base64 版本 */
  @font-face {
    font-family: 'Poxiao Pixel CN 12';
    src: url('../assets/fonts/poxiao-pixel-cn-12.woff2') format('woff2');
    font-display: block;
  }
  /* 这一段只模拟宿主 WebUI 的骨架，真实页面里由宿主自己提供 */
  html, body { height: 100%; }
  body { margin: 0; display: flex; min-height: 100vh; }

  #rail {
    position: relative; display: flex; flex-direction: column;
    justify-content: flex-start; flex: none; height: 100vh;
  }
  #rail .brand { writing-mode: horizontal-tb; }
  #rail .stack { display: flex; flex-direction: column; }
  #rail .stack > * { cursor: default; }
  #rail .railfoot { margin-top: auto; padding: 8px 6px; display: grid; gap: 4px; }
  #rail .rail-actions { display: flex; gap: 3px; }
  #rail .rail-action { width: 18px; height: 14px; padding: 0; }

  #kernel-root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .liveview { flex: 1; min-height: 0; padding: 6px; display: flex; flex-direction: column; gap: 6px; box-sizing: border-box; }
  .liveband { display: flex; gap: 8px; align-items: center; padding: 3px 6px; background: #ece9fb; border: 1px solid #b7b5d6; }
  .live-summary { display: flex; justify-content: space-between; padding: 2px 6px; }
  .tlwrap { flex: 1; min-height: 0; overflow: hidden; background: #fff; border: 1px solid #8f8dbb; box-shadow: inset 1px 1px 0 #e3e1f4; }
  .tlscroll { height: 100%; overflow: auto; padding: 8px; }
  .tlinner { display: grid; gap: 8px; }
  .turnbody { display: grid; grid-template-columns: 30px 1fr; gap: 6px; }
  .gutter { width: 30px; height: 30px; background: #dfe9f7; border: 1px solid #7c7aa8; display: grid; place-items: center; font-size: 11px; }
  .meta { font-size: 10px; color: #6b6b90; }
  .msg { padding: 5px 7px; background: #f4f3fd; border: 1px solid #cfcde8; font-size: 12px; line-height: 1.6; }
  .me .msg { background: #e7f4ff; border-color: #a9cdea; }
  .prompt { margin-top: 4px; }
  .prompt textarea { width: 100%; height: 54px; box-sizing: border-box; font-family: inherit; font-size: 12px; padding: 4px 6px; background: #fff; border: 1px solid #8f8dbb; box-shadow: inset 1px 1px 0 #e3e1f4; resize: none; }
</style>
</head>
<body>

<div id="rail">
  <div class="brand"><span style="font-size:11px;font-weight:700">Cortico</span></div>
  <nav class="stack" aria-label="导航">
    <div>控制台</div>
    <div>使用量</div>
    <div>模型连接</div>
    <div>世界与插件</div>
    <div>人格记忆</div>
    <div>设置</div>
  </nav>
  <div class="railfoot">
    <div class="rail-who">
      <div class="rail-name-text">四季环兔</div>
      <div class="rail-runstate">运行中</div>
    </div>
    <div class="rail-actions">
      <button class="rail-action"></button>
      <button class="rail-action"></button>
    </div>
  </div>
</div>

<div id="kernel-root">
  <div class="mln-chrome">
    <div class="mln-titlebar" data-kind="active">
      <div class="mln-tb-icon"></div>
      <div class="mln-tb-text">正在与 四季环兔 聊天......</div>
      <div class="mln-tb-btns">
        <button class="mln-tb-btn mln-tb-min" type="button"></button>
        <button class="mln-tb-btn mln-tb-max" type="button"></button>
        <button class="mln-tb-btn mln-tb-close" type="button"></button>
      </div>
    </div>
    <div class="mln-menubar">
      <div class="mln-menu"><button type="button"><u>F</u>ile</button></div>
      <div class="mln-menu"><button type="button"><u>E</u>dit</button></div>
      <div class="mln-menu mln-open">
        <button type="button"><u>V</u>iew</button>
        <div class="mln-drop">
          <button type="button"><span>世界与插件</span><small>#/world</small></button>
          <button type="button"><span>模型连接</span><small>#/providers</small></button>
          <div class="mln-sep"></div>
          <button type="button"><span>立绘显隐</span></button>
        </div>
      </div>
      <div class="mln-menu"><button type="button"><u>H</u>elp</button></div>
    </div>
  </div>

  <div class="liveview">
    <div class="liveband"><span>控制台</span><span style="opacity:.6">·</span><span>会话 3 条</span></div>
    <div class="live-summary"><span>主会话 · 运行中</span><span class="live-summary-right"><span>ctx 12%</span></span></div>

    <div class="tlwrap">
      <div class="tlscroll">
        <div class="tlinner">
          <div class="turnbody me">
            <div class="gutter"></div>
            <div>
              <div class="meta">19:46:05</div>
              <div class="msg">今天想聊点什么？我刚好有空。</div>
            </div>
          </div>
          <div class="turnbody">
            <div class="gutter"></div>
            <div>
              <div class="meta">19:46:09</div>
              <div class="msg">你是想说你叫 X 吗？</div>
            </div>
          </div>
          <div class="turnbody me">
            <div class="gutter"></div>
            <div>
              <div class="meta">19:46:12</div>
              <div class="msg">哈哈，被你猜到了。</div>
            </div>
          </div>
          <div class="turnbody">
            <div class="gutter"></div>
            <div>
              <div class="meta">19:46:15</div>
              <div class="msg">（捧腹大笑）这有什么好藏的嘛……</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="prompt"><textarea placeholder="输入消息…"></textarea></div>

    <div class="mln-portrait">
      <img class="mln-portrait-img" src="../assets/portrait/laugh_1.jpg" alt="">
      <div class="mln-portrait-glitch"></div>
      <div class="mln-portrait-tag">捧腹大笑</div>
    </div>
  </div>
</div>

<div class="mln-emobar" data-place="inline">
  <button class="mln-embtn" type="button"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#ffd93b" stroke="#8a6a12"/><rect x="5" y="5" width="1.6" height="2.2" fill="#4a3a08"/><rect x="9.4" y="5" width="1.6" height="2.2" fill="#4a3a08"/><path d="M4.6 9.2h6.8c-.4 2-1.8 3.2-3.4 3.2S5 11.2 4.6 9.2z" fill="#4a3a08"/></svg></button>
  <button class="mln-embtn" type="button"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" fill="#e9f2ff" stroke="#2a3f78"/><path d="M3 12l3.2-4 2.4 3 2-2.4 2.4 3.4z" fill="#3f7a4a"/><rect x="10.2" y="4.6" width="2" height="2" fill="#ffd93b"/></svg></button>
  <button class="mln-embtn" type="button"><svg viewBox="0 0 16 16"><rect x="2" y="1.5" width="12" height="13" fill="#fff" stroke="#2a3f78"/><path d="M5 11.5L8 4l3 7.5h-1.7l-.6-1.7H7.3l-.6 1.7z" fill="#1d2f6b"/></svg></button>
  <button class="mln-embtn" type="button"><svg viewBox="0 0 16 16"><path d="M8 1.5l4.6 4.6L8 14.5 3.4 6.1z" fill="#9ee7ff" stroke="#2a6f9a"/></svg></button>
  <div class="mln-emsep"></div>
  <div class="mln-emojis">
    <button class="mln-kaomoji" type="button">(｡･ω･｡)</button>
    <button class="mln-kaomoji" type="button">(๑•̀ㅂ•́)و✧</button>
    <button class="mln-kaomoji" type="button">( ˘ω˘ )</button>
    <button class="mln-kaomoji" type="button">(´；ω；`)</button>
    <button class="mln-kaomoji" type="button">(￣▽￣)</button>
    <button class="mln-kaomoji" type="button">(・∀・)</button>
  </div>
</div>

<script>
  // 预览用：把表情栏挪到输入框上方，贴近真实挂载位置
  (function () {
    var bar = document.querySelector('.mln-emobar');
    var prompt = document.querySelector('.prompt');
    var live = document.querySelector('.liveview');
    if (bar && prompt && live) live.insertBefore(bar, prompt);
  })();
</script>
</body>
</html>
