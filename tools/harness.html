<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>elymes-nte-web harness</title>
<link rel="stylesheet" href="../dist/webui.css">
<style>
  /* 尽量贴近宿主 WebUI 的骨架：#rail 左侧、#kernel-root 主区 */
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex;
    font-family: 'Segoe UI', sans-serif; background: #23283c; color: #e8e6f5;
  }
  #rail { flex: none; width: 132px; padding: 18px 10px; background: #14172a; }
  #rail .nav { display: flex; flex-direction: column; gap: 14px; }
  #rail .nav a { color: #9d9ac4; text-decoration: none; font-size: 13px; }
  #rail .nav a.on { color: #fff; font-weight: 600; }
  #rail .rail-name { margin-top: auto; padding-top: 20px; font-size: 12px; color: #8b88ad; }
  #rail .rail-name-text { color: #efeafd; font-size: 13px; }
  #kernel-root { flex: 1; min-width: 0; padding: 16px 22px; overflow: auto; }
  .sheet { background: #1b1f31; border-radius: 10px; padding: 14px; }
  .page-title { font-size: 20px; margin: 0 0 10px; }
  /* 面板挂载点 */
  #panel-root { margin-top: 14px; }
  /* 聊天页 mock（挂载皮肤后应该被重绘） */
  .liveview { display: flex; flex-direction: column; height: calc(100vh - 60px); }
  .liveband { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; }
  .tlscroll { flex: 1; overflow: auto; }
  .msg { background: #22273c; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px; }
  .meta { font-size: 11px; color: #8a87ab; margin-bottom: 4px; }
  .prompt { margin-top: 8px; }
  .prompt-input-host { background: #101322; border: 1px solid #333a56; border-radius: 6px; padding: 8px; }
  textarea { width: 100%; height: 54px; background: transparent; border: 0; color: #e8e6f5; resize: none; outline: none; font: inherit; }
  .prompt-actions { display: flex; justify-content: flex-end; }
  .prompt-actions button { background: #6f6ce0; border: 0; color: #fff; padding: 4px 14px; border-radius: 5px; }
</style>
</head>
<body>
  <div id="rail">
    <div class="brand">Coopanion</div>
    <div class="nav">
      <a href="#/live" class="on">控制台</a>
      <a href="#/usage">使用量</a>
      <a href="#/providers">模型连接</a>
      <a href="#/world">世界与插件</a>
      <a href="#/settings">设置</a>
    </div>
    <div class="rail-name">运行中<div class="rail-name-text">伊洛伊</div></div>
  </div>
  <div id="kernel-root">
    <div class="sheet">
      <h1 class="page-title">在网页上与曳尔沐聊天</h1>
      <div class="mln-hint-line">（这行是宿主页面头，目的是看皮肤会不会盖住它）</div>
      <div id="panel-root"></div>
    </div>
    <div class="liveview" id="liveview">
      <div class="liveband"><span>控制台 · 会话 3 条</span><span class="live-summary-right">ctx 12%</span></div>
      <div class="tlscroll">
        <div class="msg"><div class="meta">19:46:09</div>今天想聊点什么？我刚刷有空。</div>
        <div class="msg"><div class="meta">19:46:09</div>你是想说你叫 X 吗？</div>
        <div class="msg"><div class="meta">19:46:12</div>哈哈，被你猜到了。</div>
        <div class="msg"><div class="meta">19:46:15</div>（捧腹大笑）这有什么好藏的嘛……</div>
      </div>
      <div class="prompt">
        <div class="prompt-input-host"><textarea placeholder="输入消息..."></textarea></div>
        <div class="prompt-actions"><button>发送</button></div>
      </div>
    </div>
  </div>

<script type="module">
  // 用真实的 dist/webui.js：import 那一刻顶层代码就会跑（挂皮肤），
  // 再手动挂一次面板，检查 mount() 里有没有运行时错误。
  let report = '';
  try {
    const mod = await import('../dist/webui.js');
    const bundle = mod.default;
    report = 'import ok; panels=' + Object.keys(bundle.panels).join(',');
    const root = document.getElementById('panel-root');
    try {
      // 面板里的「打开窗口」按钮会走 ctx.invoke，这里给个假的，只为看渲染。
      const fakeInvoke = async (method) => ({
        ok: true,
        url: 'http://127.0.0.1:18800/',
        port: 18800,
        running: true,
        browser: 'msedge.exe',
        method,
      });
      const stop = bundle.panels.skin.mount({ root, invoke: fakeInvoke });
      report += '; mount=' + (typeof stop === 'function' ? 'mounted' : 'mounted-no-stop');
    } catch (err) {
      report += '; MOUNT ERROR: ' + (err && err.stack ? err.stack : String(err));
    }
  } catch (err) {
    report = 'IMPORT ERROR: ' + (err && err.stack ? err.stack : String(err));
  }
  window.__mlnPanelOk = report;
  const flag = document.createElement('div');
  flag.id = 'harness-flag';
  flag.textContent = report.slice(0, 600);
  flag.style.cssText = 'position:fixed;left:8px;bottom:6px;right:8px;z-index:99999;'
    + 'font:11px monospace;color:#7dff7d;background:#000c;padding:6px;white-space:pre-wrap';
  document.body.appendChild(flag);
</script>
</body>
</html>
