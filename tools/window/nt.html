<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <title>10KB</title>
  <link rel="stylesheet" href="./nt.css?v=8">
</head>
<body>
  <div id="stage">
    <img id="base" src="./nt/base1.webp" alt="" draggable="false">
    <div id="rgb1"></div>
    <div id="rgb2"></div>
    <div id="grid"></div>
    <div id="vignette"></div>
    <div id="windows"></div>

    <div id="caption">「我们做朋友吧」</div>

    <div id="taskbar" aria-hidden="true">
      <button type="button" class="tb-start" tabindex="-1"><span class="tb-flag"></span>开始</button>
      <button type="button" class="tb-task" tabindex="-1">10KB — 画图</button>
      <button type="button" class="tb-task" tabindex="-1">无标题 — 记事本</button>
      <button type="button" class="tb-task" tabindex="-1">回收站</button>
      <span id="tb-clock">--:--</span>
    </div>

    <div id="glitchline"></div>

    <div id="dialog" hidden></div>
  </div>
  <script src="./nt.js?v=8"></script>
</body>
</html>
